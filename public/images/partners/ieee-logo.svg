<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- IEEE Master Brand Logo -->
  <g transform="translate(10, 8)">
    <!-- IEEE Diamond Badge -->
    <path d="M37 2 L70 37 L37 72 L4 37 Z" fill="#006699" stroke="#38bdf8" stroke-width="2"/>
    <path d="M37 12 L60 37 L37 62 L14 37 Z" fill="#05192d" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Right Hand Grip / Coil & Compass Lines -->
    <circle cx="37" cy="37" r="14" stroke="#ffffff" stroke-width="2" fill="none"/>
    <path d="M37 20 L37 54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 27 L37 20 L44 27" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M26 44 C29 48 45 48 48 44" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Wordmark -->
    <text x="88" y="50" font-family="'Unbounded', 'IBM Plex Mono', 'Segoe UI', sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#ffffff">IEEE</text>
    <text x="89" y="66" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="10" letter-spacing="3" fill="#93c5fd">ADVANCING TECHNOLOGY</text>
  </g>
</svg>
