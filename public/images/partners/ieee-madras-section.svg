<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none">
  <!-- IEEE Madras Section Official Logo -->
  <g transform="translate(10, 8)">
    <!-- Madras Section Seal -->
    <circle cx="37" cy="37" r="32" fill="#042036" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="37" cy="37" r="28" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Central Kite / Meridian symbol -->
    <path d="M37 15 L51 37 L37 59 L23 37 Z" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="37" cy="37" r="5" fill="#facc15"/>
    <!-- Radiating latitude lines -->
    <path d="M14 37 L23 37 M51 37 L60 37" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Typography -->
    <text x="86" y="34" font-family="'Unbounded', sans-serif" font-weight="800" font-size="19" letter-spacing="1" fill="#ffffff">IEEE MADRAS SECTION</text>
    <text x="88" y="52" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="11" letter-spacing="2" fill="#38bdf8">REGION 10 SECTION</text>
    <text x="88" y="66" font-family="'IBM Plex Mono', monospace" font-weight="400" font-size="9" letter-spacing="1.5" fill="#94a3b8">ESTABLISHED 1978 · CHENNAI</text>
  </g>
</svg>
