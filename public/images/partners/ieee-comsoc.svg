<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- IEEE Communications Society Logo -->
  <g transform="translate(10, 8)">
    <!-- ComSoc Signal / Globe Emblem -->
    <circle cx="37" cy="37" r="32" fill="#03203c" stroke="#2563eb" stroke-width="2"/>
    <!-- Signal Orbit Rays -->
    <ellipse cx="37" cy="37" rx="28" ry="12" stroke="#60a5fa" stroke-width="1.8" fill="none" transform="rotate(-25 37 37)"/>
    <ellipse cx="37" cy="37" rx="28" ry="12" stroke="#ff7a33" stroke-width="1.8" fill="none" transform="rotate(35 37 37)"/>
    <circle cx="37" cy="37" r="7" fill="#ffffff"/>
    <circle cx="49" cy="27" r="3" fill="#ff7a33"/>
    <circle cx="23" cy="46" r="3" fill="#60a5fa"/>
    <!-- Typography -->
    <text x="86" y="38" font-family="'Unbounded', sans-serif" font-weight="800" font-size="22" letter-spacing="1" fill="#ffffff">IEEE ComSoc</text>
    <text x="88" y="55" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="11" letter-spacing="1.5" fill="#ff7a33">COMMUNICATIONS SOCIETY</text>
    <text x="88" y="68" font-family="'IBM Plex Mono', monospace" font-weight="400" font-size="8.5" letter-spacing="2" fill="#94a3b8">CONNECTING THE WORLD</text>
  </g>
</svg>
