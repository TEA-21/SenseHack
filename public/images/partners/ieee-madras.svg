<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none">
  <!-- IEEE Madras Logo -->
  <g transform="translate(10, 8)">
    <!-- Madras Chapter Crest -->
    <rect x="5" y="5" width="64" height="64" rx="14" fill="#0c1a2e" stroke="#0284c7" stroke-width="2"/>
    <!-- Temple Gopuram / Coastal Wave motif abstraction with IEEE diamond -->
    <path d="M37 14 L53 32 L37 50 L21 32 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M21 54 C28 50 46 50 53 54" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M25 60 C31 57 43 57 49 60" stroke="#f59e0b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Typography -->
    <text x="86" y="38" font-family="'Unbounded', sans-serif" font-weight="800" font-size="21" letter-spacing="1" fill="#ffffff">IEEE MADRAS</text>
    <text x="88" y="54" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="11" letter-spacing="2" fill="#38bdf8">STUDENT ACTIVITIES</text>
    <text x="88" y="68" font-family="'IBM Plex Mono', monospace" font-weight="400" font-size="9" letter-spacing="1.5" fill="#94a3b8">REGION 10 · INDIA COUNCIL</text>
  </g>
</svg>
